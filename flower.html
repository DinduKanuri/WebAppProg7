
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Finder Game</title>

    <style>
        .game-row {
            display: flex;
        }

        .game-location {
            margin: 3px;
        }

        .game-location img {
            width: 85px;
            height: 85px;
            object-fit: cover;
            border: 1px solid green;
        }
    </style>
</head>
<body>

    <h1>Dindu finds avians</h1>

    <p>Click on the locations to find the flowers, watch out for the poison ivy</p>

    <p id="locations">Number of locations checked is zero.</p>

    <p id="score">Score is zero.</p>

    <p onclick="showHelp()" style="cursor: pointer;">Click for help.</p>

    <p id="help">Help report</p>

    <div class="game-field">

        <!-- Row 1 -->
        <div class="game-row">
            <div class="game-location"><img id="img0" src="images/bush.jpg" alt="Bush" onclick="check(0)"></div>
            <div class="game-location"><img id="img1" src="images/bush.jpg" alt="Bush" onclick="check(1)"></div>
            <div class="game-location"><img id="img2" src="images/bush.jpg" alt="Bush" onclick="check(2)"></div>
            <div class="game-location"><img id="img3" src="images/bush.jpg" alt="Bush" onclick="check(3)"></div>
            <div class="game-location"><img id="img4" src="images/bush.jpg" alt="Bush" onclick="check(4)"></div>
            <div class="game-location"><img id="img5" src="images/bush.jpg" alt="Bush" onclick="check(5)"></div>
        </div>

        
        <!-- Row 2 -->
        <div class="game-row">
            <div class="game-location"><img id="img6" src="images/bush.jpg" alt="Bush" onclick="check(6)"></div>
            <div class="game-location"><img id="img7" src="images/bush.jpg" alt="Bush" onclick="check(7)"></div>
            <div class="game-location"><img id="img8" src="images/bush.jpg" alt="Bush" onclick="check(8)"></div>
            <div class="game-location"><img id="img9" src="images/bush.jpg" alt="Bush" onclick="check(9)"></div>
            <div class="game-location"><img id="img10" src="images/bush.jpg" alt="Bush" onclick="check(10)"></div>
            <div class="game-location"><img id="img11" src="images/bush.jpg" alt="Bush" onclick="check(11)"></div>
        </div>

        <!-- Row 3 -->
        <div class="game-row">
            <div class="game-location"><img id="img12" src="images/bush.jpg" alt="Bush" onclick="check(12)"></div>
            <div class="game-location"><img id="img13" src="images/bush.jpg" alt="Bush" onclick="check(13)"></div>
            <div class="game-location"><img id="img14" src="images/bush.jpg" alt="Bush" onclick="check(14)"></div>
            <div class="game-location"><img id="img15" src="images/bush.jpg" alt="Bush" onclick="check(15)"></div>
            <div class="game-location"><img id="img16" src="images/bush.jpg" alt="Bush" onclick="check(16)"></div>
            <div class="game-location"><img id="img17" src="images/bush.jpg" alt="Bush" onclick="check(17)"></div>
        </div>

        <!-- Row 4 -->
        <div class="game-row">
            <div class="game-location"><img id="img18" src="images/bush.jpg" alt="Bush" onclick="check(18)"></div>
            <div class="game-location"><img id="img19" src="images/bush.jpg" alt="Bush" onclick="check(19)"></div>
            <div class="game-location"><img id="img20" src="images/bush.jpg" alt="Bush" onclick="check(20)"></div>
            <div class="game-location"><img id="img21" src="images/bush.jpg" alt="Bush" onclick="check(21)"></div>
            <div class="game-location"><img id="img22" src="images/bush.jpg" alt="Bush" onclick="check(22)"></div>
            <div class="game-location"><img id="img23" src="images/bush.jpg" alt="Bush" onclick="check(23)"></div>
        </div>

        <!-- Row 5 -->
        <div class="game-row">
            <div class="game-location"><img id="img24" src="images/bush.jpg" alt="Bush" onclick="check(24)"></div>

            <div class="game-location"><img id="img29" src="images/bush.jpg" alt="Bush" onclick="check(29)"></div>
        </div>

        <!-- Row 6 -->
        <div class="game-row">
            <div class="game-location"><img id="img30" src="images/bush.jpg" alt="Bush" onclick="check(30)"></div>
            <div class="game-location"><img id="img31" src="images/bush.jpg" alt="Bush" onclick="check(31)"></div>
            <div class="game-location"><img id="img32" src="images/bush.jpg" alt="Bush" onclick="check(32)"></div>
            <div class="game-location"><img id="img33" src="images/bush.jpg" alt="Bush" onclick="check(33)"></div>
            <div class="game-location"><img id="img34" src="images/bush.jpg" alt="Bush" onclick="check(34)"></div>
            <div class="game-location"><img id="img35" src="images/bush.jpg" alt="Bush" onclick="check(35)"></div>
        </div>


    </div>

    <script>
        let ids = [];

        for (let i = 0; i < 36; i++) {
            ids.push("img" + i);
        }

        let score = 0;
        let locationsVisited = 0;
        let lastLocation = 0;

        let poisonLocation = 19;
        let roseLocation = 14;

        let lilyLocations = [3, 25];
        let daisyLocations = [2, 5, 11, 20, 21];

        let gameOver = false;

        function check(position) {
            if (gameOver) {
                return;
            }

            let img = document.getElementById(ids[position]);

            if (img.dataset.visited === "yes") {
                return;
            }

            if (position === poisonLocation) {
                img.src = "images/poisonivy.jpg";
                score -= 4;
                gameOver = true;
                alert("Game Over! You found poison ivy!");
            }
            else if (position === roseLocation) {
                img.src = "images/rose.jpg";
                score += 4;
            }
            else if (lilyLocations.includes(position)) {
                img.src = "images/lily.jpg";
                score += 2;
            }
            else if (daisyLocations.includes(position)) {
                img.src = "images/daisy.jpg";
                score += 1;
            }

            img.dataset.visited = "yes";
            img.onclick = null;

            locationsVisited++;
            lastLocation = position;

            document.getElementById("locations").innerHTML =
                "Number of locations checked is " + locationsVisited;

            document.getElementById("score").innerHTML =
                "Score is " + score;
        }
        
        function showHelp() {
            let row = Math.floor(lastLocation / 6);
            let col = lastLocation % 6;

            let neighbors = [
                (lastLocation + 1) % 36,
                (lastLocation + 35) % 36,
                (lastLocation + 6) % 36,
                (lastLocation + 30) % 36
            ];

            let result = "warm";

            for (let i = 0; i < neighbors.length; i++) {
                if (daisyLocations.includes(neighbors[i])) {
                    result = "cold";
                }
            }

            if (result === "warm") {
                for (let r = row - 1; r <= row + 1; r++) {
                    for (let c = col - 1; c <= col + 1; c++) {
                        if (r >= 0 && r < 6 && c >= 0 && c < 6) {
                            let position = r * 6 + c;

                            if (position === roseLocation) {
                                result = "hot";
                            }
                        }
                    }
                }
            }

            if (result === "warm") {
                for (let r = row - 1; r <= row + 1; r++) {
                    for (let c = col - 1; c <= col + 1; c++) {
                        if (r >= 0 && r < 6 && c >= 0 && c < 6) {
                            let position = r * 6 + c;

                            if (position === poisonLocation) {
                                result = "watch out";
                            }
                        }
                    }
                }
            }

            document.getElementById("help").innerHTML = "Help report: " + result;
        }


    </script>

</body>
</html>
