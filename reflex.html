<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflex Game</title>
</head>
<body>

    <h1>Reflex Game</h1>

    <p>Click Start to begin the countdown. Click Stop as soon as you see GO!</p>

    <div id="target">Your time</div>
    <div id="counter">Count</div>

    <button onclick="startTime()">Start Timer</button>
    <button onclick="stopTime()">Stop Timer</button>

    <script>
        let startTimeValue = 0;
        let timer = null;
        let count = 0;
        let gameStarted = false;
        let canStop = false;

        function startTime() {
            clearTimeout(timer);

            count = Math.floor(Math.random() * 9) + 2;

            document.getElementById("counter").innerHTML = count;
            document.getElementById("target").innerHTML = "Get Ready!";

            gameStarted = true;
            canStop = false;

            countdown();
        }

        function countdown() {
            if (count > 0) {
                document.getElementById("counter").innerHTML = count;
                count--;

                timer = setTimeout(countdown, 1000);
            } else {
                document.getElementById("counter").innerHTML = "GO!";
                document.getElementById("target").innerHTML = "Click Stop Now!";

                startTimeValue = new Date().getTime();
                canStop = true;
            }
        }

        function stopTime() {
            if (!gameStarted) {
                document.getElementById("target").innerHTML = "Click Start First!";
                return;
            }

            if (!canStop) {
                clearTimeout(timer);

                document.getElementById("target").innerHTML = "Too Soon!";
                document.getElementById("counter").innerHTML = "Try Again";

                gameStarted = false;
                return;
            }

            let endTime = new Date().getTime();
            let reactionTime = endTime - startTimeValue;

            document.getElementById("target").innerHTML =
                "Your reaction time is " + reactionTime + " milliseconds";

            document.getElementById("counter").innerHTML = "Finished!";

            gameStarted = false;
            canStop = false;
        }
    </script>

</body>
</html>
