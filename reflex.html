<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflex Countdown Game</title>
</head>
<body>

    <h1>Dindu reflexes</h1>

    <div id="target">Your time</div>

    <div id="counter">Count</div>

    <br>

    <button id="go" onclick="beginTime()">Go</button>

    <button id="halt" onclick="recordTime()">Halt</button>

    <script>
        let haltTime = undefined;

        function recordTime() {
            haltTime = Date.now();
            console.log(haltTime);
        }
    </script>

</body>
</html>
