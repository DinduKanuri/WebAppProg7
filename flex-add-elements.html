
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Add Elements</title>

    <style>
        .flex-container {
            display: flex;
            flex-direction: row;
            background-color: red;
        }

        .flex-container > div {
            background-color: #f1f1f1;
            margin: 10px;
            padding: 20px;
            font-size: 30px;
        }

        @media (max-width: 600px) {
            .flex-container {
                flex-direction: column;
                background-color: green;
            }
        }
    </style>
</head>

<body>

    <div class="flex-container" id="target">
        <div class="divlist">row item 1</div>
        <div class="divlist">row item 2</div>
        <div class="divlist">row item 3</div>
    </div>

    <p>
        Press the buttons to add or remove elements from the container.
    </p>

    <input type="text" id="itemText" placeholder="Enter an item">

    <button onclick="makeNewDiv()">Add end</button>
    <button onclick="addFront()">Add front</button>
    <button onclick="removeEveryOther()">Remove</button>
    <button onclick="shuffle()">Shuffle</button>

    <script>
        let count = 3;

        function makeNewDiv() {
            let container = document.getElementById("target");

            if (container.children.length >= 10) {
                alert("Too many items");
                return;
            }

            let text = document.getElementById("itemText").value;

            let element = document.createElement("div");
            element.textContent = text;
            element.className = "divlist";

            container.appendChild(element);
        }

        function addFront() {
            let container = document.getElementById("target");

            if (container.children.length >= 10) {
                alert("Too many items");
                return;
            }

            let text = document.getElementById("itemText").value;

            let element = document.createElement("div");
            element.textContent = text;
            element.className = "divlist";

            let first = container.firstChild;
            container.insertBefore(element, first);
        }

        function removeEveryOther() {
            let items = document.getElementsByClassName("divlist");

            for (let i = items.length - 1; i >= 0; i--) {
                if (i % 2 === 0) {
                    items[i].remove();
                }
            }
        }

        // Bonus: Randomly swap two div elements
        function shuffle() {
            let container = document.getElementById("target");
            let items = container.getElementsByClassName("divlist");

            if (items.length < 2) {
                return;
            }

            let first = Math.floor(Math.random() * items.length);
            let second = Math.floor(Math.random() * items.length);

            while (first === second) {
                second = Math.floor(Math.random() * items.length);
            }

            let firstElement = items[first];
            let secondElement = items[second];

            let marker = document.createComment("swap");

            container.replaceChild(marker, firstElement);
            container.replaceChild(firstElement, secondElement);
            container.replaceChild(secondElement, marker);
        }
    </script>

</body>
</html>
